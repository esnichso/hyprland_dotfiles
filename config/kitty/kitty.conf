# ~/.config/kitty/kitty.conf
#
# Appearance only. No keybindings, no shell integration overrides — if you had
# a kitty config on Ubuntu with bindings you care about, paste them at the
# bottom of this file and they'll take precedence.
#
# Reload without restarting: ctrl+shift+f5

# --- Font ---------------------------------------------------------------
# Mono here, Inter everywhere else in the desktop. Alignment matters in a
# terminal; it doesn't in a status bar.
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic

# Logical points. At scale 1.6 on the 2560x1600 panel this lands around the
# same physical size as 11pt on a 1080p screen.
font_size 11.0

# Ligatures everywhere except under the cursor, where they make it ambiguous
# which character you're actually on.
disable_ligatures cursor

# --- Transparency -------------------------------------------------------
# This is the setting that gives you blur behind the terminal. It affects the
# BACKGROUND ONLY — text stays fully opaque and crisp, which is the difference
# between this and a Hyprland window-rule opacity (that fades the glyphs too).
#
# Hyprland's blur then applies to whatever shows through. Lower = more
# see-through; below about 0.75 text starts to fight the wallpaper.
background_opacity 0.85

# Keep the background transparent behind text cells as well, so the blur is
# even rather than blocky.
background_blur 0
dynamic_background_opacity yes

# --- Window -------------------------------------------------------------
# Hyprland draws the border and does the rounding, so kitty shouldn't.
hide_window_decorations yes

# A little breathing room from the window edge.
window_padding_width 10

# No audible or visual bell.
enable_audio_bell no
visual_bell_duration 0

# Don't ask "are you sure" when closing a window with running processes.
confirm_os_window_close 0

# --- Scrollback ---------------------------------------------------------
scrollback_lines 10000

# --- Cursor -------------------------------------------------------------
cursor_shape block
cursor_blink_interval 0

# --- Colours ------------------------------------------------------------
# Generated from themes/<name>.toml by install/set-theme.py.
# Change the theme there, not here.
include colors.conf
