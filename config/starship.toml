# ~/.config/starship.toml
#
# Catppuccin Mocha. Two lines: context on top, a bare prompt below, so long
# paths and git state never push what you're typing off to the right.
#
# Full module list: https://starship.rs/config/
# Every module is off unless listed here — keeping it fast and quiet.

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$nodejs\
$python\
$rust\
$golang\
$jobs\
$line_break\
$character"""

# The right-hand side carries what you look at *after* a command finishes:
# how it exited and how long it took. Keeping it off the left means the cursor
# always sits in the same column, whatever ran before.
right_format = """$status$cmd_duration"""

add_newline = true

palette = "desktop"

# Only shown when you are not yourself — after `su`, or as root. Silence the
# rest of the time is the point: a prompt that always says "lucas@" is
# telling you something you already know.
[username]
show_always = false
style_user = "bold peach"
style_root = "bold red"
format = "[$user]($style) "

# Same idea: the hostname only appears over SSH, where it matters.
[hostname]
ssh_only = true
ssh_symbol = "󰢹 "
style = "bold peach"
format = "[$ssh_symbol$hostname]($style) "

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true
# Show a leading ellipsis when the path is cut, so you can tell it's truncated.
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "red"

[directory.substitutions]
"~/HPI/projects" = "󰉋 proj"
"~/.config" = " config"

[git_branch]
symbol = " "
style = "bold mauve"
format = "[$symbol$branch]($style) "

[git_status]
style = "peach"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "= "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = " ${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

# Language versions, shown only inside a project that uses them.
[nodejs]
symbol = " "
style = "green"
format = "[$symbol($version )]($style)"

[python]
symbol = " "
style = "yellow"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "peach"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "sapphire"
format = "[$symbol($version )]($style)"

# Only appears when a command took a while — useful, never noisy.
[cmd_duration]
min_time = 2000
style = "overlay1"
format = "[  $duration]($style)"

# The exit code of the last command, on the right, only when it failed.
# Worth having explicitly: a red prompt arrow tells you *that* something
# failed, this tells you what — 127 is "not found", 130 is Ctrl+C, 1 is
# everything else.
[status]
disabled = false
style = "red"
symbol = "✘ "
not_executable_symbol = "🚫 "
not_found_symbol = "🔍 "
sigint_symbol = "󰜺 "
signal_symbol = "⚡ "
format = "[$symbol$status]($style) "
map_symbol = true
pipestatus = true

# A background job indicator, so `fg` is never a surprise.
[jobs]
symbol = "󰜎 "
style = "yellow"
number_threshold = 1
format = "[$symbol$number]($style) "

# Rebase, merge, bisect — states where the next command means something
# different from usual and it is worth being reminded.
[git_state]
style = "bold peach"
format = "\\([$state( $progress_current/$progress_total)]($style)\\) "

[character]
success_symbol = "[❯](mauve)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

# >>> palette >>>
[palettes.desktop]
base = "#1e1e2e"
blue = "#89b4fa"
