# ~/.config/starship.toml
#
# Catppuccin Mocha. Two lines: context on top, a bare prompt below, so long
# paths and git state never push what you're typing off to the right.
#
# Full module list: https://starship.rs/config/
# Every module is off unless listed here — keeping it fast and quiet.

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$golang\
$cmd_duration\
$line_break\
$character"""

add_newline = true

palette = "catppuccin_mocha"

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true
# Show a leading ellipsis when the path is cut, so you can tell it's truncated.
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "red"

[git_branch]
symbol = " "
style = "bold mauve"
format = "[$symbol$branch]($style) "

[git_status]
style = "peach"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "= "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = " ${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

# Language versions, shown only inside a project that uses them.
[nodejs]
symbol = " "
style = "green"
format = "[$symbol($version )]($style)"

[python]
symbol = " "
style = "yellow"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "peach"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "sapphire"
format = "[$symbol($version )]($style)"

# Only appears when a command took a while — useful, never noisy.
[cmd_duration]
min_time = 2000
style = "overlay1"
format = "[took $duration]($style) "

[character]
success_symbol = "[❯](mauve)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
