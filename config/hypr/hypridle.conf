# ~/.config/hypr/hypridle.conf
#
# Idle management: dim, lock, screen off, suspend. hyprlang format, not Lua.
#
# Reference: docs/hyprland/Hypr_Ecosystem_hypridle.md
#
# The timings below assume a laptop you walk away from. Adjust the `timeout`
# values (seconds) to taste; the ordering is what matters — dim, then lock, then
# blank, then sleep.

general {
    # `pidof` guard so a second hyprlock can't stack on top of the first.
    lock_cmd = pidof hyprlock || hyprlock

    # Lock before suspending, so the machine never wakes up unlocked.
    before_sleep_cmd = loginctl lock-session

    # Wake the display on resume, otherwise you have to press a key twice.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'

    # 2 = auto. Makes systemd wait for the lock to actually be up before
    # suspending, so the screen is never briefly visible on wake.
    inhibit_sleep = 2
}

# 2.5 min — dim the backlight. `-s` saves the current level so `-r` can restore
# it exactly, including whatever you'd set it to manually.
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 2.5 min — keyboard backlight off. Harmless if this ThinkPad has none.
listener {
    timeout = 150
    on-timeout = brightnessctl -sd tpacpi::kbd_backlight set 0
    on-resume = brightnessctl -rd tpacpi::kbd_backlight
}

# 5 min — lock. Via logind so everything watching session state agrees.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min — screen off. Half a minute after locking, so the lock screen isn't
# briefly showing to the room before the panel blanks.
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

# 20 min — suspend, but only on battery. On AC the machine stays up, which is
# what you want when it's plugged in, syncing, or you're at a desk.
#
# condition_cmd must exit 0 for on-timeout to fire. `AC/online` is 1 when the
# charger is connected, so this returns non-zero (defer) while plugged in.
listener {
    timeout = 1200
    on-timeout = systemctl suspend
    condition_cmd = test "$(cat /sys/class/power_supply/AC/online)" = "0"
    condition_retry = 60
}
