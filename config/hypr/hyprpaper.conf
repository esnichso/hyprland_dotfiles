# ~/.config/hypr/hyprpaper.conf
#
# Wallpaper daemon. hyprlang format, not Lua.
# Reference: docs/hyprland/Hypr_Ecosystem_hyprpaper.md
#
# Put images in ~/Pictures/wallpapers and they get picked up automatically —
# autostart.lua only launches hyprpaper if that directory has something in it,
# so an empty folder leaves you with the flat background colour instead of an
# error.

# Don't draw the Hyprland splash text over the wallpaper.
splash = false

# Leave IPC on so you can change wallpaper without restarting:
#   hyprctl hyprpaper wallpaper ",~/Pictures/wallpapers/foo.jpg,cover"
ipc = true

wallpaper {
    # Empty monitor = applies to every display, including ones plugged in later.
    monitor =

    # A directory rotates through the images inside it.
    # A single file path works too: path = ~/Pictures/wallpapers/wall.jpg
    path = ~/Pictures/wallpapers

    # cover = fill the screen, cropping overflow. What you want almost always.
    # contain = fit entirely, letterboxed. tile = repeat. fill = stretch.
    fit_mode = cover

    # No automatic rotation.
    #
    # hyprpaper has no "don't rotate" switch — with a directory as `path` it
    # cycles on `timeout`, which defaults to 30 seconds. Setting it to a week
    # means it picks one image at random when the session starts and then
    # leaves it alone, which is the behaviour you want: a different wallpaper
    # now and then when you log in, never a change while you're working.
    #
    # To pin one image permanently, point `path` at the file instead:
    #     path = ~/Pictures/wallpapers/wall.jpg
    # and delete the three lines below.
    timeout = 604800
    order = random
    recursive = false
}
