# ~/.config/hypr/hyprpaper.conf
#
# Wallpaper daemon. hyprlang format, not Lua.
# Reference: docs/hyprland/Hypr_Ecosystem_hyprpaper.md
#
# Deliberately no `wallpaper { }` block.
#
# Which wallpaper is showing is a *runtime* choice, made by
# scripts/wallpaper.sh and stored in ~/.local/state/hypr/wallpaper. Baking it
# in here would mean a script rewriting this file — and this file is a symlink
# into the git repo, so every wallpaper change would show up as a dirty repo.
#
# The script applies the saved wallpaper over IPC at login (see autostart.lua)
# and whenever you pick a new one. Until you have picked one, you get the flat
# background colour from conf/looks.lua, which looks deliberate.
#
#   SUPER + W          pick one, with thumbnails
#   SUPER + SHIFT + W  random

# Don't draw the Hyprland splash text over the wallpaper.
splash = false

# Required — the script talks to hyprpaper through this.
ipc = true
