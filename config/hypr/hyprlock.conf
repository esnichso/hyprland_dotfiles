# ~/.config/hypr/hyprlock.conf
#
# Lock screen. Note this is hyprlang, NOT Lua — only Hyprland itself moved to
# Lua in 0.55. The other hypr* tools still use this key = value format.
#
# Reference: docs/hyprland/Hypr_Ecosystem_hyprlock.md
#
# WARNING: if this file is missing or unparseable, hyprlock exits with an error
# and your session does not lock. Test changes with `hyprlock` in a terminal
# before trusting them.

general {
    hide_cursor = true
    # Don't try to authenticate an empty password.
    ignore_empty_input = true
    # Draw widgets immediately rather than waiting for the blurred background.
    # Without this there's a visible delay before the password box appears.
    immediate_render = true
    fail_timeout = 2000
}

# Authentication.
#
# Note the nesting. The wiki lists these options as `pam:enabled` and
# `fingerprint:enabled`, but that is path notation for the docs table — in the
# file itself they are sub-blocks. Writing `pam:enabled = true` inside `auth`
# defines an option literally called "pam:enabled", which hyprlock does not
# recognise.
#
# PAM is enabled by default, so this block is really only here for the
# fingerprint switch.
auth {
    pam {
        enabled = true
        # Falls back to the "su" PAM module if /etc/pam.d/hyprlock is absent.
        module = hyprlock
    }

    fingerprint {
        # Set to true once you've enrolled a finger with `fprintd-enroll`.
        # Runs in parallel with the password field.
        enabled = false
        ready_message = Scan fingerprint to unlock
    }
}

animations {
    enabled = true
    bezier = easeOut, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 2.5, easeOut
    animation = fadeOut, 1, 2, easeOut
    animation = inputFieldDots, 1, 1.5, easeOut
}

# Background: a blurred screenshot of whatever was on screen. No wallpaper file
# needed, and it makes the lock read as "your session, paused" rather than a
# separate screen.
background {
    monitor =
    path = screenshot

    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.9
    brightness = 0.4
    vibrancy = 0.17
    vibrancy_darkness = 0.05
}

# Big clock.
label {
    monitor =
    text = $TIME
    color = rgba(cdd6f4ff)
    font_size = 110
    font_family = JetBrainsMono Nerd Font ExtraBold

    position = 0, 260
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(11111baa)
}

# Date, in German to match the system locale. Updates once a minute.
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d. %B"
    color = rgba(a6adc8ff)
    font_size = 22
    font_family = JetBrainsMono Nerd Font

    position = 0, 165
    halign = center
    valign = center
}

# Greeting.
label {
    monitor =
    text = Hallo, $USER
    color = rgba(cba6f7ff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font Medium

    position = 0, 55
    halign = center
    valign = center
}

# Password field.
input-field {
    monitor =
    size = 340, 56
    outline_thickness = 2
    rounding = 14

    dots_size = 0.28
    dots_spacing = 0.3
    dots_center = true

    outer_color = rgba(cba6f7ee) rgba(89b4faee) 45deg
    inner_color = rgba(1e1e2ecc)
    font_color = rgba(cdd6f4ff)
    font_family = JetBrainsMono Nerd Font

    # Amber while checking, red on failure — you can tell what happened without
    # reading the text.
    check_color = rgba(f9e2afee)
    fail_color = rgba(f38ba8ee)
    fail_text = <i>$FAIL</i> <b>($ATTEMPTS)</b>

    # Warn about caps lock. Easy to leave on given Caps is remapped to Escape
    # in Hyprland but NOT here — hyprlock reads the raw keyboard.
    capslock_color = rgba(fab387ee)

    placeholder_text = <i>Passwort…</i>
    fade_on_empty = false

    position = 0, -60
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(11111b99)
}

# Battery and keyboard layout, bottom left.
label {
    monitor =
    text = cmd[update:30000] printf "%s%%  ·  %s" "$(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null || echo '--')" "$(cat /sys/class/power_supply/BAT0/status 2>/dev/null || echo '--')"
    color = rgba(9399b2ff)
    font_size = 14
    font_family = JetBrainsMono Nerd Font

    position = 30, 25
    halign = left
    valign = bottom
}

# Hint, bottom right.
label {
    monitor =
    text = Enter zum Entsperren
    color = rgba(6c7086ff)
    font_size = 13
    font_family = JetBrainsMono Nerd Font

    position = -30, 25
    halign = right
    valign = bottom
}
