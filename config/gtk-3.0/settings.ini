# ~/.config/gtk-3.0/settings.ini
#
# GTK3 appearance. Thunar, pavucontrol, blueman, nm-connection-editor and most
# other non-Qt apps read this.
#
# Note: some GTK apps read the *gsettings* values instead of this file. The
# theme.sh script in config/hypr/scripts sets both — run it once after
# install, or just log out and back in.

[Settings]
gtk-theme-name=catppuccin-mocha-mauve-standard+default
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Bibata-Modern-Classic
gtk-cursor-theme-size=24

# Inter for UI text, matching the bar and launcher.
gtk-font-name=Inter 11

# Hyprland draws borders and shadows; GTK shouldn't add its own title bars
# where it can be avoided.
gtk-decoration-layout=:

gtk-application-prefer-dark-theme=1
gtk-enable-animations=1
gtk-primary-button-warps-slider=0

gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
