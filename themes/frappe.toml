# Catppuccin Frappé — Mocha lifted a stop.
#
# Same hues, higher base luminance. Easier on the eyes in a lit room than
# Mocha without going all the way to a light theme.

name = "Catppuccin Frappe"
dark = true

gtk_theme = "catppuccin-frappe-mauve-standard+default"
icon_theme = "Papirus-Dark"

[palette]
crust    = "#232634"
mantle   = "#292c3c"
base     = "#303446"

surface0 = "#414559"
surface1 = "#51576d"
surface2 = "#626880"

overlay0 = "#737994"
overlay1 = "#838ba7"
overlay2 = "#949cbb"

subtext0 = "#a5adce"
subtext1 = "#b5bfe2"
text     = "#c6d0f5"

rosewater = "#f2d5cf"
flamingo  = "#eebebe"
pink      = "#f4b8e4"
mauve     = "#ca9ee6"
red       = "#e78284"
maroon    = "#ea999c"
peach     = "#ef9f76"
yellow    = "#e5c890"
green     = "#a6d189"
teal      = "#81c8be"
sky       = "#99d1db"
sapphire  = "#85c1dc"
blue      = "#8caaee"
lavender  = "#babbf1"

[roles]
accent     = "mauve"
accent_alt = "blue"
urgent     = "red"
warning    = "peach"
success    = "green"
info       = "yellow"
link       = "blue"

[ansi]
black          = "surface1"
red            = "red"
green          = "green"
yellow         = "yellow"
blue           = "blue"
magenta        = "pink"
cyan           = "teal"
white          = "subtext1"
bright_black   = "surface2"
bright_red     = "red"
bright_green   = "green"
bright_yellow  = "yellow"
bright_blue    = "blue"
bright_magenta = "pink"
bright_cyan    = "teal"
bright_white   = "subtext0"
